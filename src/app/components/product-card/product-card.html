
<article class="product-card" [class.added]="added">

  <div class="added-badge" [hidden]="!added">
    ✓ produto adicionado
  </div>

  <div class="product-image">

    <img
      [src]="produto.imagem"
      [alt]="produto.nome"
    >

  </div>

  <div class="product-info">

    <h2>
      {{ produto.nome }}
    </h2>

    <p>
      {{ produto.descricao }}
    </p>

    <strong>
      {{ produto.preco | currency:'BRL' }}
    </strong>

    <div class="card-actions">

      <button
        class="view-button"
        type="button"
        (click)="verDetalhe()"
      >
        Ver
      </button>

      <button
        class="add-button"
        type="button"
        (click)="adicionarAoCarrinho()"
      >
        Adicionar
      </button>

      <button
        class="favorite-button"
        type="button"
        [class.active]="produto.favorito"
        (click)="favoritar()"
        [attr.aria-label]="
          produto.favorito
            ? 'Remover dos favoritos'
            : 'Adicionar aos favoritos'
        "
      >
        ♥
      </button>

    </div>

  </div>

</article>
